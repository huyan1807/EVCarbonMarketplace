version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlpreview
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Huyan@1807
      - MSSQL_PID=Evaluation
    ports:
      - "1434:1433"
    networks:
      - my_network
    volumes:
      - ./sql_data:/var/opt/mssql # Persist data
  carbonmarketplaceapi:
    build:
      context: .
      dockerfile: EVCarbonMarketplace.API/Dockerfile
    container_name: carbonmarketplaceapi
    depends_on:
      - sqlserver
      - redis
    environment:
      ConnectionStrings__DefaultDB: "Server=sqlserver,1433;Database=EVCarbonMarketplace;User Id=sa;Password=Huyan@1807;TrustServerCertificate=True"
      ConnectionStrings__Redis: "redis:6379,abortConnect=false"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8888:8080"
    networks:
      - my_network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - my_network

networks:
  my_network:
    driver: bridge
